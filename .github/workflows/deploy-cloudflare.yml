name: Deploy to Cloudflare

# master への push で Pages ai-netabook を deploy する(UI 確定版・凍結中。worker/ は別 Worker のソースなので公開しない)。
# 鍵(CLOUDFLARE_API_TOKEN)が未設定なら、黙ってスキップせず赤く失敗する。
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 035926d851c17dfd9cf096e0884cd474
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN not set - deploy was NOT performed. Set the repo secret."
            exit 1
          fi
          # 公開するのはサイトのファイルだけ(.git・.github・README などは入れない)
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude 'README.md' --exclude 'worker'
          npx wrangler@4 pages deploy /tmp/site --project-name ai-netabook --branch master --commit-dirty=true